<!DOCTYPE html>
<!-- Index: home page providing the form to compute the shortest path. -->
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Trouver le plus court chemin</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v={{ STATIC_VERSION }}">
</head>
<body>
    
        <!-- Page title and form -->
        <h1 class="text-center mb-4">Calculateur chemin le plus court entre deux villes</h1>
        <form action="{{ url_for('chemin') }}" method="POST" name="chemin_form" onsubmit= " return validerFormulaire()">
          
          <div class="form-group">
            <label for="debut">Ville de départ:</label>
            <p><input type="text" name="debut" id="debut" /></p>
          </div>
          <div class="form-group">
            <label for="fin">Ville d'arrivée:</label>
            <p><input type="text" name="fin" id="fin" /></p>
          </div>
            <input type="submit" value="Trouver le plus court chemin" class="btn btn-primary"/>
            <input type="reset" value="Reset the form" class="btn btn-reset"/>
        </form>

        <!-- Simple client-side validation to avoid empty submissions -->
        <script type="text/javascript">
          function validerFormulaire() {
            var debut = document.getElementById('debut').value;
            var fin = document.getElementById('fin').value;
            if (debut === '' || fin === '') {
              alert("Veuillez sélectionner une ville de départ et une ville d'arrivée.");
              return false;
            }
            return true;
          }
        </script>
</body>
</html>
