<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Plus court chemin</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v={{ STATIC_VERSION }}">
</head>
<body class="bg-light">
  <form action="" method="get">
    <div class="container">
    <h1 class="text-center">Plus court chemin entre {{ start_node }} et {{ target_node }}</h1>
    <ul class="list-group">
      <li class="list-group-item">{{ chemin }}</li> 
    </ul>
    <p class="text-center lead">Distance : {{ distance }} km</p>
  </div>
  <button type="button" class="btn btn-primary mt-3" onclick="goBack()">Retour</button>

  
  </form>
  <script type="text/javascript">
    function goBack() {
      window.history.back();
    }
    </script>
</body>
</html>
